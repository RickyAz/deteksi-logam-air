<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deteksi Logam Air - Bunga Telang</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; padding: 16px; }
    .container { width: 100%; max-width: 480px; background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.4rem; color: #1e3a8a; }
    header p { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
    .preview-card { width: 100%; height: 260px; background-color: #e2e8f0; border: 2px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .preview-card img { width: 100%; height: 100%; object-fit: cover; }
    #placeholderText { color: #94a3b8; font-size: 0.9rem; }
    .guide-box { background-color: #eff6ff; border-left: 4px solid #3b82f6; padding: 10px 12px; border-radius: 6px; margin: 16px 0; font-size: 0.82rem; color: #1e40af; }
    .action-section input[type="file"] { display: none; }
    .btn-camera { display: block; width: 100%; background-color: #2563eb; color: white; text-align: center; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 10px; cursor: pointer; }
    .result-card { margin-top: 20px; padding: 16px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; }
    .color-badge { width: 40px; height: 40px; border-radius: 50%; margin: 10px 0; border: 2px solid #cbd5e1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Detektor Kualitas Air</h1>
      <p>Analisis kandungan logam air via reaksi warna indikator alami</p>
    </header>

    <main>
      <div class="preview-card">
        <div id="placeholderText">Belum ada foto sampel</div>
        <img id="photoPreview" alt="Pratinjau Sampel" style="display: none;">
      </div>

      <div class="guide-box">
        <small>💡 <strong>Tips Foto:</strong> Posisikan sampel di tengah dan pastikan cahaya terang.</small>
      </div>

      <div class="action-section">
        <label for="cameraInput" class="btn-camera">📷 Ambil Foto Sampel Air</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
      </div>

      <div id="resultCard" class="result-card" style="display: none;">
        <h3>Hasil Analisis Web (JS)</h3>
        <p id="statusText">Memproses gambar...</p>
        <div id="colorBadge" class="color-badge"></div>
        <div id="detailResult"></div>
      </div>
    </main>
  </div>

  <script>
    const cameraInput = document.getElementById('cameraInput');
    const photoPreview = document.getElementById('photoPreview');
    const placeholderText = document.getElementById('placeholderText');
    const resultCard = document.getElementById('resultCard');
    const statusText = document.getElementById('statusText');
    const colorBadge = document.getElementById('colorBadge');
    const detailResult = document.getElementById('detailResult');

    cameraInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        photoPreview.src = event.target.result;
        photoPreview.style.display = 'block';
        placeholderText.style.display = 'none';

        analisisWarnaJS(event.target.result);
      };
      reader.readAsDataURL(file);
    });

    // Konversi RGB ke HSV di JavaScript (Tanpa OpenCV/Python)
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      let max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      let d = max - min;
      s = max === 0 ? 0 : d / max;

      if (max === min) {
        h = 0;
      } else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return { h: Math.round(h * 360), s: Math.round(s * 100), v: Math.round(v * 100) };
    }

    function analisisWarnaJS(imageSrc) {
      resultCard.style.display = 'block';
      statusText.innerText = 'Menganalisis piksel...';

      const img = new Image();
      img.src = imageSrc;
      img.onload = function () {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const centerX = Math.floor(img.width / 2);
        const centerY = Math.floor(img.height / 2);
        const imageData = ctx.getImageData(centerX - 30, centerY - 30, 60, 60).data;

        let r = 0, g = 0, b = 0;
        const totalPixels = imageData.length / 4;

        for (let i = 0; i < imageData.length; i += 4) {
          r += imageData[i];
          g += imageData[i + 1];
          b += imageData[i + 2];
        }

        r = Math.round(r / totalPixels);
        g = Math.round(g / totalPixels);
        b = Math.round(b / totalPixels);

        const hsv = rgbToHsv(r, g, b);

        colorBadge.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;

        let status = "", bahaya = "", detail = "";

        // Logika Hue 360 Derajat
        if ((hsv.h >= 270 && hsv.h <= 340) || (hsv.h >= 0 && hsv.h <= 20)) {
          status = "Terindikasi Asam / Logam Tinggi";
          bahaya = "Bahaya";
          detail = "Warna cenderung ungu/merah. Antosianin bereaksi terhadap lingkungan asam/ion logam.";
        } else if (hsv.h >= 180 && hsv.h < 270) {
          status = "Netral / Air Layak";
          bahaya = "Aman";
          detail = "Warna biru jernih dipertahankan. pH dalam batas normal.";
        } else if (hsv.h >= 60 && hsv.h < 180) {
          status = "Terindikasi Basa";
          bahaya = "Waspada";
          detail = "Warna berubah kehijauan/kuning. Indikasi kondisi basa.";
        } else {
          status = "Warna Tidak Spesifik";
          bahaya = "Info";
          detail = "Pastikan pencahayaan terang dan gelas di posisi tengah.";
        }

        statusText.innerText = status;
        detailResult.innerHTML = `
          <p><strong>Tingkat Risiko:</strong> <span style="color:${bahaya === 'Bahaya' ? 'red' : 'green'}">${bahaya}</span></p>
          <p style="margin-top:4px;"><strong>Nilai Hue (Warna):</strong> ${hsv.h}°</p>
          <p style="margin-top:6px; font-size: 0.85rem;">${detail}</p>
        `;
      };
    }
  </script>
</body>
</html>
